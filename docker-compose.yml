# Local dev environment for the FlowControl core.
#
# This host cannot build Rust natively (Windows blocks build scripts), so the
# core runs in a container. The repo is bind-mounted, the cargo registry and
# target dir are cached in named volumes (incremental rebuilds), and `cargo
# watch --poll` restarts `flowd serve` whenever a Rust source file changes.
#
# The web app (flowui) stays on the host for instant Vite/HMR:
#   npm --prefix flowui run dev          # talk to the core on 127.0.0.1:50051
#
# Instead of native cargo here, the same command runs today inside WSL/Linux
# where build scripts are not blocked:
#   cd flowd && cargo watch -x 'run -- serve --db :memory: --seed'
#
# Usage:
#   docker compose up --build        # run the core (cargo watch, live reload)
#   docker compose down             # stop it
services:
  flowd:
    build:
      context: .
      dockerfile: flowd/Dockerfile
    image: flowd-dev:latest
    command:
      - cargo-watch
      - --poll
      - -x
      # FLOWD_PORT comes from the repo-root .env; --addr 0.0.0.0 lets the
      # container accept traffic the docker-proxy forwards (loopback only in
      # native use). No .env present -> 50051.
      - "run -- serve --addr 0.0.0.0:${FLOWD_PORT:-50051} --db :memory: --seed"
    ports:
      - "${FLOWD_PORT:-50051}:${FLOWD_PORT:-50051}"
    volumes:
      - type: bind
        source: .
        target: /work
      - flowd-cargo:/usr/local/cargo/registry
      - flowd-target:/tmp/target
    working_dir: /work/flowd
    environment:
      CARGO_TARGET_DIR: /tmp/target
      RUST_LOG: info

  # One-shot Go runner for flowcli tests. The host blocks executing freshly built
  # test binaries; a container's own execution isn't. `profiles` keeps it out of
  # `docker compose up`. Run: `docker compose run --rm flowcli-test go test ./...`.
  flowcli-test:
    image: golang:1.26
    profiles: ["tools"]
    working_dir: /work/flowcli
    volumes:
      - type: bind
        source: .
        target: /work
      - flowcli-go-mod:/go/pkg/mod
      - flowcli-go-build:/root/.cache/go-build

volumes:
  flowd-cargo:
    name: flowd-cargo
  flowd-target:
    name: flowd-target
  flowcli-go-mod:
    name: flowcli-go-mod
  flowcli-go-build:
    name: flowcli-go-build
