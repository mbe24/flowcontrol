[package]
name = "flowd"
version = "0.1.0"
edition = "2021"
description = "FlowControl core daemon (native gRPC edge over flowcore)"

[lib]
name = "flowd"
path = "src/lib.rs"

[[bin]]
name = "flowd"
path = "src/main.rs"

[dependencies]
# The shared sync core (store, dispatch, proto messages). `grpc` compiles the
# tonic FlowService stubs that this edge implements.
flowcore = { path = "../flowcore", features = ["grpc"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["router"] }
tonic-web = "0.12"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
proptest = "1"
prost = "0.13" # tests encode/decode proto messages (dispatch round-trips)
