[package]
name = "flowd"
version = "0.1.0"
edition = "2021"
description = "FlowControl core daemon"

[lib]
name = "flowd"
path = "src/lib.rs"

[[bin]]
name = "flowd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
http = "1"
async-trait = "0.1"
