[package]
name = "flowd"
version = "0.1.0"
edition = "2021"
description = "FlowControl core daemon"

[lib]
name = "flowd"
path = "src/lib.rs"

[[bin]]
name = "flowd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["router"] }
tonic-web = "0.12"
axum = "0.7"
prost = "0.13"
# rusqlite (bundled SQLite, compiled from source with FTS5/JSON1/RTREE enabled
# unconditionally). Chosen over sqlx because it compiles to wasm32 via the
# `sqlite-wasm-rs` backend, unlocking the Node/browser hosts — sqlx's SQLite is C
# that does not build for wasm. The store runs it synchronously behind a Mutex.
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
proptest = "1"
prost = "0.13" # dispatch round-trip tests encode/decode proto messages
