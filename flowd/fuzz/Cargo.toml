[package]
name = "flowd-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
once_cell = "1"
tokio = { version = "1", features = ["rt", "sync"] }
flowd = { path = ".." }

# Keep the fuzz crate out of any parent workspace resolution.
[workspace]

[[bin]]
name = "search_never_panics"
path = "fuzz_targets/search_never_panics.rs"
test = false
doc = false
bench = false
