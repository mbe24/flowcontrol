# The target-agnostic core of the flow system: proto messages, the domain-error
# taxonomy, the SQLite schema/migrations, and the synchronous store + `dispatch`
# ("the service minus the socket"). No tokio, no tonic in the default build, so it
# compiles to wasm32. Native `flowd` and a future wasm cdylib both build on it.
[package]
name = "flowcore"
version = "0.1.0"
edition = "2021"
description = "FlowControl shared core (sync store, dispatch, proto messages)"

[lib]
name = "flowcore"
path = "src/lib.rs"

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The generated tonic service stubs live here but are gated: only `flowd` (the
# native edge) enables `grpc`; the wasm build never pulls tonic.
tonic = { version = "0.12", optional = true, features = ["router"] }

# SQLite backend by target: native compiles the C amalgamation (bundled, FTS5);
# wasm32 uses sqlite-wasm-rs (also FTS5) via rusqlite's ffi-sqlite-wasm-rs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "0.40", features = ["ffi-sqlite-wasm-rs"] }

[features]
# `flowd` enables this to compile the tonic FlowService stubs.
grpc = ["dep:tonic"]
