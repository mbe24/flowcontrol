# `flowcore` compiled to wasm + a wasm-bindgen `dispatch` facade for JS hosts (the
# Node daemon `flowd.js` and the browser). SQLite does NOT live in the wasm: the
# store runs over the `Sql` seam, bridged to host functions (`HostSql`), so this is
# a pure-Rust wasm — no C toolchain, no sqlite-wasm-rs. Build:
#   cargo build -p flowwasm --target wasm32-unknown-unknown
# then wasm-bindgen --target nodejs (Node) / bundler (browser) for the JS glue.
[package]
name = "flowwasm"
version = "0.1.0"
edition = "2021"
description = "flowcore as a wasm module with a JS dispatch facade"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default features (no `grpc`) → the tonic-free, wasm-safe core.
flowcore = { path = "../flowcore" }
wasm-bindgen = "0.2"
serde_json = "1"
