name: Deploy web app to GitHub Pages

# Builds flowui (Vite/Svelte static) and deploys it to GitHub Pages.
# Pages source must be set to "GitHub Actions" in the repo settings.
# Manual only (Actions → "Run workflow") — no auto-deploy on push.
on:
  workflow_dispatch:

# Least privilege for the Pages deploy (OIDC id-token + pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # flowui's standalone build runs flowcore in the browser, so the wasm glue
      # (gitignored, generated) must exist before the Vite build. Build it natively
      # for wasm32 and copy it in — the same recipe as `npm run gen:wasm`, without Docker.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Generate the wasm glue (web target)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo build -p flowwasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir flowwasm/pkg-web \
            target/wasm32-unknown-unknown/release/flowwasm.wasm
          sh flowui/scripts/copy-wasm.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (workspace root)
        run: pnpm install --frozen-lockfile

      # Demo build: the in-browser flowcore engine over OPFS (VITE_DEMO=1).
      # BASE_PATH = the project-site subpath (/<repo>); a user/org site would use "".
      - name: Build the web app demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm --filter flowui build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: flowui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
