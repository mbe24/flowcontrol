name: Deploy web app to GitHub Pages

# Builds flowui (Vite/Svelte static) and deploys it to GitHub Pages.
# Pages source must be set to "GitHub Actions" in the repo settings.
# Manual only (Actions → "Run workflow") — no auto-deploy on push.
on:
  workflow_dispatch:

# Least privilege for the Pages deploy (OIDC id-token + pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: flowui/package-lock.json

      # BASE_PATH = the project-site subpath (/<repo>); a user/org site would use "".
      - name: Install + build the web app
        working-directory: flowui
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: flowui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
